[project]
name = "twin-core"
version = "1.0.0"
description = "UAV Digital Twin — pure, importable reasoning library"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0,<3.0.0",
    "pandas>=2.2.0,<3.0.0",
    "scipy>=1.13.0,<1.17.0",
    "scikit-learn>=1.5.0,<1.8.0",
]

[project.optional-dependencies]
lstm = ["tensorflow>=2.16.0,<2.23.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["twin_core"]
